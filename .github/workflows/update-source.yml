name: 每日刷新央视频接口源

# 每天早上 06:00（北京时间 = UTC+8）自动刷新源索引 ysp.json，
# 有变化就提交回仓库，让播放器的固定订阅链接长期有效。
#
# 注意：Actions 的 cron 走 UTC，06:00 (UTC+8) 对应 22:00 UTC（前一天）。
on:
  schedule:
    - cron: '0 22 * * *'
  # 允许在 GitHub 网页上手点一次 Run workflow（首次生成正确的订阅地址时用）
  workflow_dispatch:

# 提交 ysp.json 需要写权限；仓库设置里也要把
# Settings → Actions → General → Workflow permissions 设为 Read and write
permissions:
  contents: write

# 同一时间只跑一个，避免两次提交打架
concurrency:
  group: update-ysp-source
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 刷新接口源（体检插件 + 重写 ysp.json）
        # GITHUB_REPOSITORY 会被脚本自动读作 owner/repo，
        # 因此这里不用再传 --repo，订阅地址会写成当前仓库的 raw 链接。
        run: python scripts/update_source.py

      - name: 有变化才提交
        run: |
          if [ -z "$(git status --porcelain ysp.json)" ]; then
            echo "ysp.json 无变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ysp.json
          git commit -m "chore: 自动刷新央视频接口源 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push
